[project]
name = "text-to-sql-rag-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "riteshsal", email = "riteshsalve86@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faker>=40.40.0",
    "fastapi>=0.142.1",
    "langchain>=1.4.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
text-to-sql-rag-system = "text_to_sql_rag_system:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
